          <p>途中、雨が降り出してしまい、演奏中断する場面もありましたが☔️</p>
          <p>難しい天候の中でも、できる限りのエールを送りました。</p>
          <p>過酷なレースの中、選手の皆さんは笑顔で手を挙げて応えてくださったり、力強い走りに感動しました！</p>
          <p>また、同じ諏訪地域の社会人バンド同士での貴重な交流の機会となり、とても楽しく、良い経験になりました😊</p>
